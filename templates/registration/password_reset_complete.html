{% extends "base/index.html" %}
{% block title %}Пароль змінено{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="card px-8 py-10 text-center" style="border: 1px solid var(--crow-border); background: var(--crow-surface, #141416); border-radius: 0.5rem;">

        <!-- Іконка успіху -->
        <div class="flex justify-center mb-6">
            <div class="flex items-center justify-center w-16 h-16 rounded-full"
                 style="background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>

        <h1 class="font-display" style="font-size: 1.5rem; font-weight: 600; color: var(--gold); margin-bottom: 0.75rem;">
            Пароль успішно змінено
        </h1>

        <hr class="gold-rule my-4" style="border: none; height: 1px; background: linear-gradient(90deg, transparent, #C9A84C 40%, #C9A84C 60%, transparent);">

        <p class="font-body" style="color: var(--text-muted, #a1a1aa); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
            Ваш новий пароль збережено. Тепер ви можете увійти в свій акаунт,
            використовуючи оновлені дані.
        </p>

        <a href="{% url 'login' %}"
           class="inline-block w-full py-3 px-6 rounded font-body font-medium transition"
           style="background: var(--gold); color: #0D0D0F; letter-spacing: 0.02em;"
           onmouseover="this.style.background='var(--gold-light, #DFC078)'"
           onmouseout="this.style.background='var(--gold)'">
            Увійти в акаунт
        </a>

        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted, #71717a); font-style: italic;">
            Ні ковтача, ні вини. Тільки чистий розрахунок.
        </p>
    </div>
</div>
{% endblock %}
